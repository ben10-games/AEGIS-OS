# GUI v1: the Linux launcher (local-vm/run-aegis-gui-vm.sh) creates the development user
# at first boot through systemd credentials: 'sysusers.extra' with the account and
# 'passwd.hashed-password.<user>' with its password hash. systemd-sysusers.service
# imports the password credential for root only (run 44749833133: the user was created
# with a locked password). This lets it read the hashed form for any user it creates;
# plaintext passwords are still not imported. The credentials come from the virtual
# firmware, the same channel and trust as sysusers.extra.
[Service]
ImportCredential=passwd.hashed-password.*
