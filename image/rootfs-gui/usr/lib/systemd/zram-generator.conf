# AEGIS OS (v3, M13): compressed swap in RAM (zram), as Fedora Workstation sets it up.
# zram-generator is installed with the base image, but without this file it creates no
# device, and the desktop ran without any swap (v3 runs, `free -m`). Pages are compressed
# in memory and never written to disk. Half of RAM, at most 8 GiB, zstd.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
