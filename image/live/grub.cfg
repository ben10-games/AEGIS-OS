# AEGIS OS Live ISO boot menu (Fedora's signed shim and GRUB, UEFI only).
# @LABEL@ and @KARGS@ are filled in by scripts/container/assemble-live-iso.
set default=0
set timeout=5
search --no-floppy --set=root --label '@LABEL@'
menuentry 'AEGIS OS Live (graphical desktop)' --class aegis {
    linux /images/pxeboot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 @KARGS@
    initrd /images/pxeboot/initrd.img
}
menuentry 'AEGIS OS Live (basic graphics: firmware framebuffer, nomodeset)' --class aegis {
    linux /images/pxeboot/vmlinuz root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 @KARGS@ nomodeset
    initrd /images/pxeboot/initrd.img
}
menuentry 'UEFI firmware settings' {
    fwsetup
}
