# With bootc's composefs backend, /var is a bind mount set up by the initramfs
# (/state/os/<os>/var on the root partition); systemd sees it as a dynamic mount without
# a unit file and does not order it before local-fs.target. This ordering makes ordinary
# services (which start after local-fs.target) stop before /var is unmounted.
# journald is handled by aegis-journal-relinquish.service (BUG-8).
[Unit]
Before=local-fs.target
