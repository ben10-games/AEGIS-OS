# With bootc's composefs backend, /var is a bind mount set up by the initramfs
# (/state/os/<os>/var on the root partition). systemd does not order such a mount
# before local-fs.target, so at shutdown it unmounted /var while services that keep
# files open there (journald, firewalld, auditd) were still stopping, and the
# unmount failed with "target is busy" (CI runs 44090714344 to 44100054742).
# Ordinary services start after local-fs.target and therefore now stop before /var
# is unmounted.
[Unit]
Before=local-fs.target
