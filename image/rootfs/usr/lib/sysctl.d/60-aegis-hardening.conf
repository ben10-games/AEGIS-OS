# AEGIS OS kernel settings. Sorted after Fedora's and systemd's defaults (10-*, 50-*)
# so these values win. The reviewed list is tests/golden/sysctl.txt.

# --- kernel: information leaks and ways to modify or inspect the running kernel ---
# Hide kernel addresses from every user, root included.
kernel.kptr_restrict = 2
# Only root may read the kernel log.
kernel.dmesg_restrict = 1
# Unprivileged users may not profile the kernel.
kernel.perf_event_paranoid = 2
# No replacement kernel can be loaded into the running system.
kernel.kexec_load_disabled = 1
# Unprivileged eBPF stays off until reboot; harden the JIT for privileged users.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# A process may trace only its own descendants.
kernel.yama.ptrace_scope = 1
# Terminal line disciplines are not loaded on request of unprivileged users.
dev.tty.ldisc_autoload = 0
# userfaultfd is a common exploitation aid; unprivileged use is off.
vm.unprivileged_userfaultfd = 0

# --- file system ---
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# No core dumps of setuid programs.
fs.suid_dumpable = 0

# --- network ---
# Strict reverse-path filtering: drop packets whose source could not be reached through
# the interface they arrived on. The wildcard covers interfaces that already exist.
# May need revisiting for multi-homed, VPN and VM networking (Phase 3).
net.ipv4.conf.*.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# A desktop is not a router: ignore and never send ICMP redirects.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Source-routed packets let the sender choose the path; refuse them.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# SYN flood protection; ignore broadcast pings and bogus ICMP errors.
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
