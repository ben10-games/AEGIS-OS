# AEGIS OS v3: the system account that runs the first-boot setup session (AEGIS Setup).
# No password (locked); used only by SDDM's automatic login while the machine has no
# account yet (aegis-firstboot.service). A system UID, so SDDM never lists it.
u aegis-setup - "AEGIS first-boot setup" /var/lib/aegis-setup /bin/bash
