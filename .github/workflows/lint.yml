name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (S-01 to S-04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install hash-pinned Python tools
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-hashes --no-deps \
            -r build/ci/requirements-lint.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Install version-pinned Go tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Tool versions
        run: |
          ruff --version
          pytest --version
          yamllint --version
          shellcheck --version | sed -n '2p'
          actionlint -version | head -n 1
          gitleaks version

      - name: make lint
        run: make lint
