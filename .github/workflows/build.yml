name: build

# Builds the images, installs aegis-dev into a disk image and boots it in QEMU.
# One job on purpose: the images are several gigabytes and are not passed between jobs.
#
# The development disk image for local testing (LOCAL_VM_GUIDE.md) is exported and
# tested on every run. It is published as an artifact only when the workflow is started
# by hand, or when the head commit message contains [publish-image]; a 1 GB artifact
# for every push would only fill the storage quota.
on:
  push:
  pull_request:
  workflow_dispatch:

# packages: read lets the job pull the mirrored base image (docs/operations/base-image.md).
permissions:
  contents: read
  packages: read

# Runs queue instead of cancelling each other: every pushed commit keeps its evidence.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-boot:
    name: Build images, check manifests, boot both variants in a VM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # packages: write only for "Publish signed images" (default branch, on request); the
    # token is referenced only by the registry login step (enforced by a static test).
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make /dev/kvm accessible to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Environment
        run: scripts/probe-env

      - name: Log in to the container registry (read-only) for the mirrored base image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | sudo podman login --username "${REGISTRY_USER}" --password-stdin ghcr.io

      # P1-15: the only package source of every build below. Fails closed.
      - name: Fetch and verify the locked RPM inputs
        run: make inputs

      - name: Negative tests of the input checks (tampered, missing, extra RPMs)
        run: make input-test

      # Also the tools stage of the image build (signing, UKI), so it is built first.
      - name: Build test and tools container
        run: make builder

      # Throw-away Secure Boot keys are generated inside this step and exist only in
      # this job's workspace (scripts/dev-keys).
      - name: Build sealed container images (B-01)
        run: make image

      # P1-16: SBOM (checked by the image tests, B-07) and a report-only scan.
      - name: SBOM and vulnerability report
        run: make sbom

      - name: Image inventory
        run: make inventory

      - name: Build disk images (both variants)
        id: disk
        run: make disk

      - name: Export the development image for local testing (QCOW2)
        id: export
        run: make export

      - name: Golden manifest tests (B-02, B-03, B-04)
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: make image-test

      # Runs even when the manifest tests fail, so one push reports both.
      - name: Virtual machine tests
        id: vmtest
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: make vm-test

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo chown -R "$(id -u):$(id -g)" out
          rm -f out/disk.raw out/disk-base.raw out/release/*.uefi-vars.*
          scripts/summarize-results | tee out/summary.txt
          {
            echo '### Build and boot'
            echo '```'
            cat out/summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload logs and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-and-boot-${{ github.sha }}
          path: |
            out/*.txt
            out/*.xml
            out/inventory/
            out/sbom/
            out/vm/logs/
          if-no-files-found: warn
          retention-days: 14

      # Only an image whose every test passed in this job is offered for download.
      - name: Publish the tested development image
        id: publish
        if: >-
          ${{ success() && (github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[publish-image]')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-os-dev-qcow2
          path: out/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # P1-13: signed images to GHCR. Default branch only, on request, after every test
      # in this job passed. Tags are never overwritten; signatures are verified after
      # the push with this run's public key (published as an artifact).
      - name: Publish signed images to GHCR
        id: publish-signed
        if: >-
          ${{ success() && github.ref_name == github.event.repository.default_branch
          && (github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[publish-image]')) }}
        run: scripts/publish-images "git-${GITHUB_SHA::12}"

      - name: Upload the signing public key and published references
        if: ${{ steps.publish-signed.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-os-signed-images
          path: |
            out/published.txt
            out/aegis-os-signing.pub
          if-no-files-found: error
          retention-days: 90

  reproducibility:
    name: Two independent clean builds (R-01, R-02, R-03)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the container registry (read-only) for the base image and RPM inputs
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | sudo podman login --authfile "${RUNNER_TEMP}/auth.json" \
            --username "${REGISTRY_USER}" --password-stdin ghcr.io

      - name: Build twice and compare (R-01 and R-02 required, R-03 reported)
        run: REGISTRY_AUTH_FILE="${RUNNER_TEMP}/auth.json" make repro

      - name: Collect results
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" out || true
          {
            echo '### Reproducibility'
            echo '```'
            cat out/repro/a/evidence.txt out/repro/b/evidence.txt out/repro/r03.txt 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          sudo rm -f "${RUNNER_TEMP}/auth.json"

      - name: Upload the evidence of both builds
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility-${{ github.sha }}
          path: |
            out/repro/
            out/junit-repro.xml
          if-no-files-found: warn
          retention-days: 14

  windows-launch:
    name: Start the published image on Windows with the documented launcher
    needs: build-and-boot
    if: ${{ needs.build-and-boot.outputs.published == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegis-os-dev-qcow2

      - name: Install QEMU for Windows
        shell: pwsh
        run: |
          choco install qemu --no-progress -y
          & "$env:ProgramFiles\qemu\qemu-system-x86_64.exe" --version

      - name: Verify the checksums as described in the guide
        shell: pwsh
        run: |
          $expected = @{}
          Get-Content .\SHA256SUMS | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $expected[$name.Trim()] = $hash
          }
          foreach ($name in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash
            if ($actual -ne $expected[$name]) { throw "checksum mismatch for $name" }
            Write-Host "OK $name"
          }

      - name: Boot with run-aegis-vm.ps1, log in on the console and over SSH, power off
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $image = (Get-Item .\aegis-os-dev-*.qcow2).FullName
          $key = Join-Path $env:RUNNER_TEMP "aegis_id"
          ssh-keygen -q -t ed25519 -N "" -C "aegis-windows-ci" -f $key
          $log = Join-Path $env:RUNNER_TEMP "serial.log"

          $vm = Start-Process pwsh -PassThru -ArgumentList @(
            "-NoProfile", "-File", ".\run-aegis-vm.ps1", "-Image", $image,
            "-SshKey", "$key.pub", "-Snapshot", "-SerialLog", $log, "-Accel", "tcg")

          # Software emulation is slow; allow 30 minutes for the automatic console login.
          $deadline = (Get-Date).AddMinutes(30)
          $loggedIn = $false
          while ((Get-Date) -lt $deadline) {
            if ($vm.HasExited) { throw "the launcher exited with code $($vm.ExitCode)" }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "root@aegis" -Quiet)) {
              $loggedIn = $true
              break
            }
            Start-Sleep -Seconds 15
          }
          if (Test-Path $log) { Get-Content $log -Tail 25 }
          if (-not $loggedIn) { throw "no automatic root login on the serial console" }
          Write-Host "CONSOLE LOGIN: ok"

          $sshArgs = @("-i", $key, "-p", "2222", "-o", "BatchMode=yes",
            "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL",
            "-o", "ConnectTimeout=20", "root@127.0.0.1")
          $ok = $false
          for ($attempt = 0; $attempt -lt 40 -and -not $ok; $attempt++) {
            $out = & ssh @sshArgs "getenforce; grep ^IMAGE_ID= /usr/lib/os-release; hostname" 2>&1
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          Write-Host ($out -join "`n")
          if (-not $ok) { throw "SSH login with the launch-time key failed" }
          if (-not (($out -join " ") -match "Enforcing")) { throw "SELinux is not enforcing" }
          if (-not (($out -join " ") -match "IMAGE_ID=aegis-dev")) { throw "not the AEGIS image" }
          Write-Host "SSH LOGIN: ok"

          & ssh @sshArgs "systemctl poweroff" 2>&1 | Out-Null
          if (-not $vm.WaitForExit(600000)) { throw "the VM did not power off" }
          Write-Host "POWER OFF: ok (launcher exit code $($vm.ExitCode))"

  # M4-GUI: the graphical development image (KDE Plasma 6, Wayland) is built, sealed,
  # installed and booted under Secure Boot in its own job, next to the main suite.
  gui:
    name: Graphical development image (M4-GUI) under Secure Boot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make /dev/kvm accessible to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Log in to the container registry (read-only) for the mirrored base image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | sudo podman login --username "${REGISTRY_USER}" --password-stdin ghcr.io

      # P1-15: the only package source of every build below (includes the 'gui' step).
      - name: Fetch and verify the locked RPM inputs
        run: make inputs

      - name: Build test and tools container
        run: make builder

      - name: Build and seal the images, including the graphical one
        run: make image-gui

      - name: Install the graphical image into a disk image
        id: disk
        run: make disk-gui

      - name: Graphical and Secure Boot tests in a VM
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: make gui-test

      # GUI v1: the downloadable image, booted with the published launcher before it is
      # offered (OVMF without Secure Boot keys, as on a user's machine).
      - name: Export the graphical image for local use (QCOW2)
        id: export-gui
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: make export-gui

      - name: Boot the exported image with the Linux launcher
        if: ${{ !cancelled() && steps.export-gui.outcome == 'success' }}
        run: make gui-local-test

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo chown -R "$(id -u):$(id -g)" out
          scripts/summarize-gui | tee out/summary-gui.txt

      - name: Upload logs, screenshots and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-${{ github.sha }}
          path: |
            out/summary-gui.txt
            out/junit-gui*.xml
            out/vm-gui/logs/
          if-no-files-found: warn
          retention-days: 14

      # Only an image whose every test in this job passed is offered for download.
      - name: Publish the tested graphical image
        if: >-
          ${{ success() && (github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[publish-image]')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-os-gui-qcow2
          path: out/release-gui/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
