name: build

# Builds the images, installs aegis-dev into a disk image and boots it in QEMU.
# One job on purpose: the images are several gigabytes and are not passed between jobs.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs queue instead of cancelling each other: every pushed commit keeps its evidence.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-boot:
    name: Build image, build disk, boot in VM (B-01, B-08, V-01, V-02)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make /dev/kvm accessible to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Environment
        run: scripts/probe-env

      - name: Build container images (B-01)
        run: make image

      - name: Build disk image
        run: make disk

      - name: Build test container
        run: make builder

      - name: Boot and shutdown tests (V-01, V-02)
        run: make vm-test

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo chown -R "$(id -u):$(id -g)" out
          rm -f out/disk.raw
          {
            echo '### Build and boot'
            echo '```'
            cat out/build-info.txt 2>/dev/null || echo 'no build info'
            cat out/builder-versions.txt 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          ls -la out out/vm/logs 2>/dev/null || true

      - name: Upload logs and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-and-boot-${{ github.sha }}
          path: |
            out/*.txt
            out/*.xml
            out/vm/logs/
          if-no-files-found: warn
          retention-days: 14
