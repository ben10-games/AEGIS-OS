name: build

# Builds the images, installs aegis-dev into a disk image and boots it in QEMU.
# One job on purpose: the images are several gigabytes and are not passed between jobs.
#
# The development disk image for local testing (LOCAL_VM_GUIDE.md) is exported and
# tested on every run. It is published as an artifact only when the workflow is started
# by hand, or when the head commit message contains [publish-image]; a 1 GB artifact
# for every push would only fill the storage quota.
on:
  push:
  pull_request:
  workflow_dispatch:

# packages: read lets the job pull the mirrored base image (docs/operations/base-image.md).
permissions:
  contents: read
  packages: read

# Runs queue instead of cancelling each other: every pushed commit keeps its evidence.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-boot:
    name: Build images, check manifests, boot both variants in a VM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make /dev/kvm accessible to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Environment
        run: scripts/probe-env

      - name: Log in to the container registry (read-only) for the mirrored base image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | sudo podman login --username "${REGISTRY_USER}" --password-stdin ghcr.io

      # Also the tools stage of the image build (signing, UKI), so it is built first.
      - name: Build test and tools container
        run: make builder

      # Throw-away Secure Boot keys are generated inside this step and exist only in
      # this job's workspace (scripts/dev-keys).
      - name: Build sealed container images (B-01)
        run: make image

      - name: Image inventory
        run: make inventory

      - name: Build disk images (both variants)
        id: disk
        run: make disk

      - name: Export the development image for local testing (QCOW2)
        id: export
        run: make export

      - name: Golden manifest tests (B-02, B-03, B-04)
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: make image-test

      # Runs even when the manifest tests fail, so one push reports both.
      - name: Virtual machine tests
        id: vmtest
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: make vm-test

      - name: Collect results
        if: always()
        run: |
          mkdir -p out
          sudo chown -R "$(id -u):$(id -g)" out
          rm -f out/disk.raw out/disk-base.raw out/release/*.uefi-vars.*
          scripts/summarize-results | tee out/summary.txt
          {
            echo '### Build and boot'
            echo '```'
            cat out/summary.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload logs and test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-and-boot-${{ github.sha }}
          path: |
            out/*.txt
            out/*.xml
            out/inventory/
            out/vm/logs/
          if-no-files-found: warn
          retention-days: 14

      # Only an image whose every test passed in this job is offered for download.
      - name: Publish the tested development image
        id: publish
        if: >-
          ${{ success() && (github.event_name == 'workflow_dispatch'
          || contains(github.event.head_commit.message, '[publish-image]')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aegis-os-dev-qcow2
          path: out/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-launch:
    name: Start the published image on Windows with the documented launcher
    needs: build-and-boot
    if: ${{ needs.build-and-boot.outputs.published == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aegis-os-dev-qcow2

      - name: Install QEMU for Windows
        shell: pwsh
        run: |
          choco install qemu --no-progress -y
          & "$env:ProgramFiles\qemu\qemu-system-x86_64.exe" --version

      - name: Verify the checksums as described in the guide
        shell: pwsh
        run: |
          $expected = @{}
          Get-Content .\SHA256SUMS | ForEach-Object {
            $hash, $name = $_ -split '\s+', 2
            $expected[$name.Trim()] = $hash
          }
          foreach ($name in $expected.Keys) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash
            if ($actual -ne $expected[$name]) { throw "checksum mismatch for $name" }
            Write-Host "OK $name"
          }

      - name: Boot with run-aegis-vm.ps1, log in on the console and over SSH, power off
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $image = (Get-Item .\aegis-os-dev-*.qcow2).FullName
          $key = Join-Path $env:RUNNER_TEMP "aegis_id"
          ssh-keygen -q -t ed25519 -N "" -C "aegis-windows-ci" -f $key
          $log = Join-Path $env:RUNNER_TEMP "serial.log"

          $vm = Start-Process pwsh -PassThru -ArgumentList @(
            "-NoProfile", "-File", ".\run-aegis-vm.ps1", "-Image", $image,
            "-SshKey", "$key.pub", "-Snapshot", "-SerialLog", $log, "-Accel", "tcg")

          # Software emulation is slow; allow 30 minutes for the automatic console login.
          $deadline = (Get-Date).AddMinutes(30)
          $loggedIn = $false
          while ((Get-Date) -lt $deadline) {
            if ($vm.HasExited) { throw "the launcher exited with code $($vm.ExitCode)" }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "root@aegis" -Quiet)) {
              $loggedIn = $true
              break
            }
            Start-Sleep -Seconds 15
          }
          if (Test-Path $log) { Get-Content $log -Tail 25 }
          if (-not $loggedIn) { throw "no automatic root login on the serial console" }
          Write-Host "CONSOLE LOGIN: ok"

          $sshArgs = @("-i", $key, "-p", "2222", "-o", "BatchMode=yes",
            "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=NUL",
            "-o", "ConnectTimeout=20", "root@127.0.0.1")
          $ok = $false
          for ($attempt = 0; $attempt -lt 40 -and -not $ok; $attempt++) {
            $out = & ssh @sshArgs "getenforce; grep ^IMAGE_ID= /usr/lib/os-release; hostname" 2>&1
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          Write-Host ($out -join "`n")
          if (-not $ok) { throw "SSH login with the launch-time key failed" }
          if (-not (($out -join " ") -match "Enforcing")) { throw "SELinux is not enforcing" }
          if (-not (($out -join " ") -match "IMAGE_ID=aegis-dev")) { throw "not the AEGIS image" }
          Write-Host "SSH LOGIN: ok"

          & ssh @sshArgs "systemctl poweroff" 2>&1 | Out-Null
          if (-not $vm.WaitForExit(600000)) { throw "the VM did not power off" }
          Write-Host "POWER OFF: ok (launcher exit code $($vm.ExitCode))"
