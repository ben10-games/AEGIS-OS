name: probe

# P1-00: record what GitHub-hosted runners can actually do, so later tasks do not
# assume KVM, loop devices or registry access (assumptions A1 and A2).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-env
      - .github/workflows/probe.yml

permissions:
  contents: read
  packages: read

jobs:
  probe:
    name: Runner capabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capabilities before any change
        run: scripts/probe-env

      - name: Make /dev/kvm accessible to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "A1: /dev/kvm does not exist on this runner"

      - name: "A1: does QEMU start with KVM acceleration?"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86
          # With -S the guest CPU never runs. If KVM initialises, QEMU stays alive until
          # timeout kills it (exit 124). Any other exit status means KVM is unusable.
          status=0
          timeout 5 qemu-system-x86_64 -accel kvm -machine q35 -cpu host -m 256 \
            -display none -nodefaults -serial none -monitor none -S || status=$?
          if [[ "${status}" -eq 124 ]]; then
            echo "A1 RESULT: KVM usable"
          else
            echo "A1 RESULT: KVM NOT usable (qemu exit ${status})"
            exit 1
          fi

      - name: "A2: bootc and boot components in fedora-bootc:45"
        run: |
          image=quay.io/fedora/fedora-bootc:45
          sudo podman pull --quiet "${image}"
          echo "A2 base digest: $(sudo podman image inspect --format '{{.Digest}}' "${image}")"
          sudo podman run --rm "${image}" bootc --version
          sudo podman run --rm "${image}" \
            rpm -q bootc kernel systemd bootupd systemd-boot-unsigned systemd-ukify \
            selinux-policy-targeted firewalld audit openssh-server || true
          echo "A2 package count: $(sudo podman run --rm "${image}" rpm -qa | wc -l)"

      - name: Log in to the container registry (read-only) for the mirrored base image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | sudo podman login --username "${REGISTRY_USER}" --password-stdin ghcr.io
          printf '%s' "${REGISTRY_TOKEN}" \
            | skopeo login --username "${REGISTRY_USER}" --password-stdin ghcr.io

      # A digest pin only helps while the registry still serves that digest.
      - name: "Base image pin: still available? Which immutable tags exist?"
        run: |
          pinned="$(grep -E '^BASE_IMAGE=' image/base.lock | cut -d= -f2-)"
          repository="$(grep -E '^UPSTREAM_REPOSITORY=' image/base.lock | cut -d= -f2-)"
          if skopeo inspect --raw "docker://${pinned}" > /dev/null 2> pin-error.txt; then
            echo "PIN RESULT: ${pinned} is available"
          else
            echo "PIN RESULT: ${pinned} is GONE: $(tail -n 1 pin-error.txt)"
          fi
          echo "tags of ${repository} that start with 45:"
          skopeo list-tags "docker://${repository}" \
            | grep -oE '"45[^"]*"' | tr -d '"' | sort -V | tail -n 40 | paste -sd' ' || true

      # Facts the sealed boot chain (milestone M3) is designed from.
      - name: "M3: sealed-image support in the pinned base and in Fedora's packages"
        run: |
          pinned="$(grep -E '^BASE_IMAGE=' image/base.lock | cut -d= -f2-)"
          sudo podman run --rm "${pinned}" bash -c '
            set -uo pipefail
            echo "== packages"
            rpm -q bootc systemd dracut ostree composefs bootupd shim-x64 grub2-efi-x64 \
              grub2-tools systemd-boot-unsigned systemd-ukify sbsigntools btrfs-progs \
              e2fsprogs fsverity-utils kernel-core
            echo "== bootc container subcommands"
            bootc container --help 2>&1 | sed -n "/Commands:/,/Options:/p"
            echo "== bootc install to-disk options (composefs, bootloader, verity, uki)"
            bootc install to-disk --help 2>&1 | grep -E -A3 -- "--(composefs|bootloader|allow-missing|uki|filesystem)"
            echo "== dracut modules and configuration"
            ls /usr/lib/dracut/modules.d | grep -E "bootc|composefs|ostree|systemd-pcr|tpm" || true
            for f in /usr/lib/dracut/dracut.conf.d/*; do echo "--- ${f}"; cat "${f}"; done
            echo "== initramfs content (bootc, composefs, ostree)"
            lsinitrd /usr/lib/modules/*/initramfs.img 2>/dev/null \
              | grep -E "bootc|composefs|ostree-prepare|initrd-release|os-release" | head -n 20
            echo "== backend markers"
            ls -l /usr/lib/ostree/prepare-root.conf /usr/lib/composefs 2>&1
            cat /usr/lib/ostree/prepare-root.conf 2>&1
            ls /usr/lib/bootupd/updates 2>&1 | head -n 5
            ls /usr/lib/modules/*/ | head -n 20
            ls -l /boot /usr/lib/systemd/boot/efi 2>&1 | head -n 20
            echo "== available packages"
            dnf -q list --available systemd-boot-unsigned systemd-ukify sbsigntools \
              python3-virt-firmware fsverity-utils mokutil 2>&1 | tail -n 12
            echo "== UEFI firmware files"
            dnf -q -y install edk2-ovmf > /dev/null 2>&1
            ls -l /usr/share/edk2/ovmf/
            for f in /usr/share/qemu/firmware/*.json; do
              echo "--- ${f}"
              grep -E "\"(filename|mode|secure-boot|enrolled-keys|requires-smm)\"|\"machines\"" "${f}" \
                | tr -s " " | paste -sd" "
            done
          '

      # Facts the first graphical image (M4-GUI) is designed from.
      - name: "M4-GUI: Plasma 6 packages, display manager, transaction size"
        run: |
          pinned="$(grep -E '^BASE_IMAGE=' image/base.lock | cut -d= -f2-)"
          sudo podman run --rm "${pinned}" bash -c '
            set -uo pipefail
            echo "== availability"
            dnf -q list --available sddm sddm-wayland-plasma plasma-login-manager \
              plasma-desktop plasma-workspace plasma-workspace-wayland kwin kwin-wayland \
              konsole dolphin systemsettings plasma-nm plasma-pa plasma-systemsettings \
              pipewire wireplumber pipewire-pulseaudio kf6-kirigami qt6-qtdeclarative \
              breeze-icon-theme plasma-breeze xdg-desktop-portal-kde mesa-dri-drivers \
              google-noto-sans-fonts kde-settings-plasma kscreen kinfocenter \
              qt6-qtwayland plasma-lookandfeel-fedora f45-backgrounds-kde 2>&1 | sort | head -n 60
            echo "== comps group kde-desktop (mandatory and default)"
            dnf -q group info kde-desktop 2>&1 | head -n 80
            echo "== transaction for a minimal Plasma set (no weak deps)"
            dnf install --assumeno --setopt=install_weak_deps=False \
              plasma-desktop plasma-workspace kwin konsole dolphin systemsettings plasma-nm \
              plasma-pa pipewire wireplumber pipewire-pulseaudio kf6-kirigami sddm \
              sddm-wayland-plasma xdg-desktop-portal-kde mesa-dri-drivers google-noto-sans-fonts \
              2>&1 | tail -n 8
          '

      - name: Loop devices inside a privileged container
        run: |
          sudo podman run --rm --privileged quay.io/fedora/fedora-bootc:45 bash -c '
            set -euo pipefail
            truncate -s 64M /tmp/probe.img
            dev="$(losetup --find --show /tmp/probe.img)"
            echo "LOOP RESULT: attached ${dev}"
            losetup --detach "${dev}"
          '

      - name: Capabilities after setup
        if: always()
        run: |
          scripts/probe-env | tee probe.txt
          df -h /
          {
            echo '### Runner capabilities'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
