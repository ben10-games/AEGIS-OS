name: dev-signing-bootstrap

# ADR-0015: creates the persistent DEVELOPMENT signing identity (Secure Boot PK/KEK/db
# and the image signing key) once, and stores it only as secrets of the environment
# aegis-dev-signing. Never creates production keys. Setup and rotation:
# docs/operations/dev-signing-setup.md.
#
# Started only by a push to the v3 branch that changes keys/dev/bootstrap-request and
# whose commit subject line begins with [bootstrap-dev-signing] (GitHub offers "Run
# workflow" only for workflows on the default branch, which this one is not on), or by
# hand with the confirmation text once it is.
#
# Two jobs: 'preflight' holds no secret and checks, with read access only, that
# aegis-dev-bootstrap exists and requires a reviewer and that aegis-dev-signing deploys
# only to selected branches. Only then is 'bootstrap' created; it waits for the owner's
# approval in aegis-dev-bootstrap. (Run 46015720213 showed why: a job that names an
# environment which does not exist yet creates it, unprotected, and runs at once. That
# run stopped at the missing token, before any key was generated.)
on:
  push:
    branches:
      - claude/aegis-os-v3
    paths:
      - keys/dev/bootstrap-request
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "create the development signing identity"
        required: true

permissions:
  contents: read

concurrency:
  group: dev-signing-bootstrap
  cancel-in-progress: false

jobs:
  preflight:
    name: Check that both signing environments are protected
    if: >-
      ${{ github.ref == 'refs/heads/claude/aegis-os-v3'
      && (inputs.confirm == 'create the development signing identity'
      || (github.event_name == 'push'
      && startsWith(github.event.head_commit.message, '[bootstrap-dev-signing]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check the environments' protection (read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers="$(gh api "repos/${REPOSITORY}/environments/aegis-dev-bootstrap" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')"
          branches="$(gh api "repos/${REPOSITORY}/environments/aegis-dev-signing" \
            --jq '.deployment_branch_policy.custom_branch_policies')"
          echo "aegis-dev-bootstrap required-reviewer rules: ${reviewers}"
          echo "aegis-dev-signing limited to selected branches: ${branches}"
          if [[ "${reviewers}" -lt 1 || "${branches}" != true ]]; then
            echo "error: finish steps 1 and 2 of docs/operations/dev-signing-setup.md" >&2
            exit 1
          fi

  bootstrap:
    name: Create the development signing identity (aegis-dev-signing)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: aegis-dev-bootstrap
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the container registry (read-only) for the locked RPM inputs
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" \
            | sudo podman login --username "${REGISTRY_USER}" --password-stdin ghcr.io

      - name: Fetch and verify the locked RPM inputs
        run: make inputs

      - name: Build test and tools container
        run: make builder

      - name: Create the identity and store it as environment secrets
        env:
          GH_TOKEN: ${{ secrets.AEGIS_DEV_BOOTSTRAP_TOKEN }}
        run: scripts/bootstrap-dev-signing
